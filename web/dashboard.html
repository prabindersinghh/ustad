<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ustad · Supervisor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230064E0'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'%3EU%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --blue:#0064e0; --blue-600:#0052bd; --ink:#0a1020; --ink-soft:#33405c;
    --muted:#64728c; --white:#fff; --cloud:#eef3fc; --cloud-2:#f6f9ff;
    --line:#dbe6f7; --ok:#12a06a; --bad:#e5484d; --warn:#e8900a;
    --shadow:0 12px 34px rgba(10,50,120,.10); --shadow-sm:0 4px 16px rgba(10,50,120,.07);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:
      radial-gradient(1200px 560px at 78% -10%, #e9f1ff 0%, rgba(233,241,255,0) 55%),
      var(--cloud-2);
    color:var(--ink);
    font:16px/1.5 "Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue);text-decoration:none}
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 28px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
    background:rgba(255,255,255,.82); backdrop-filter:saturate(1.4) blur(12px);
  }
  header.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  header.top h1 .mark{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--blue);
    color:#fff;border-radius:8px;font-size:17px;font-weight:800}
  header.top h1 small{color:var(--muted);font-weight:500;font-size:14px}
  .backend-chip{font-size:13px;color:var(--muted)}
  .backend-chip b{color:var(--ink);font-weight:600}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 28px 72px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:14px;margin-bottom:26px}
  .kpi{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm)}
  .kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.accent{color:var(--blue)}
  .kpi .l{font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:7px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:880px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .panel h2{margin:0;padding:17px 20px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .panel h2 .count{color:var(--muted);font-weight:500;font-size:13px}
  .rows{max-height:560px;overflow:auto}
  .row{padding:15px 20px;border-bottom:1px solid var(--line);cursor:pointer;display:block;width:100%;
    text-align:left;background:none;border-left:3px solid transparent;color:var(--ink);font:inherit}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--cloud-2)}
  .row.sel{border-left-color:var(--blue);background:var(--cloud)}
  .row .t{font-weight:700;letter-spacing:-.01em}
  .row .m{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--cloud-2)}
  .pill.ok{color:var(--ok);border-color:#bfe6d4;background:#eafaf2}
  .pill.bad{color:var(--bad);border-color:#f6c9cb;background:#fdecec}
  .pill.warn{color:var(--warn);border-color:#f4ddb0;background:#fdf4e3}
  .pill.backend{color:var(--blue-600);border-color:#c4dcff;background:#eef5ff}
  .empty{padding:44px 18px;text-align:center;color:var(--muted)}

  #detail{margin-top:22px}
  .steps{display:grid;gap:12px}
  .step{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    border-left:3px solid var(--line);display:grid;grid-template-columns:1fr 168px;gap:18px;box-shadow:var(--shadow-sm)}
  .step.pass{border-left-color:var(--ok)} .step.fail{border-left-color:var(--bad)}
  .step.retry{border-left-color:var(--warn)} .step.skipped{border-left-color:var(--muted)}
  .step .h{font-weight:700;margin-bottom:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .step .kv{font-size:13px;color:var(--ink-soft);margin:4px 0}
  .step .kv b{color:var(--ink);font-weight:600}
  .step img{width:168px;height:126px;object-fit:cover;border-radius:12px;background:#000;border:1px solid var(--line)}
  .step .noimg{width:168px;height:126px;border-radius:12px;border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
  .muted{color:var(--muted)}
  .hint{font-size:14px;color:var(--muted);padding:12px 2px}
  code{color:var(--blue-600);font-weight:600}
  .struggle{margin-bottom:14px;padding:14px 16px;border-radius:14px;background:#fdecec;border:1px solid #f6c9cb;color:#7a1f22;font-size:14px;line-height:1.5}
  .struggle b{color:#5c1013}
  .pill.kind{color:var(--blue-600);border-color:#c4dcff;background:#eef5ff}
  .stepstat{margin-top:8px !important;color:var(--blue-600) !important;font-weight:600}
  .step.inferred{border-left-color:var(--blue)} .step.confirmed{border-left-color:var(--ok)}
  .spend{margin-bottom:26px}
  .spend-body{padding:16px 20px 18px}
  .spend-top{font-size:14px;color:var(--ink-soft);margin-bottom:10px}
  .spend-top b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
  .bar{height:8px;border-radius:99px;background:var(--cloud);overflow:hidden}
  .bar span{display:block;height:100%;border-radius:99px;background:var(--ok)}
  .bar span.warn{background:var(--warn)} .bar span.bad{background:var(--bad)}
  table.usage{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
  table.usage th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.usage td{padding:7px 8px;border-bottom:1px solid var(--line)}
  table.usage .num{text-align:right;font-variant-numeric:tabular-nums}
  .ref{position:relative;width:168px;line-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;align-self:start}
  .ref img{width:168px;height:auto;display:block}
  .ref .box{position:absolute;border:2px solid #ffc53d;border-radius:5px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
  .ref small{position:absolute;left:6px;bottom:6px;line-height:1.2;font-size:10.5px;font-weight:700;color:#2a1d00;background:#ffc53d;padding:2px 7px;border-radius:999px}
  .quote{font-style:italic;color:var(--ink-soft)}
  .improve{margin-bottom:16px;border:1px solid #c4dcff;border-radius:14px;background:#f5f9ff;padding:14px 16px}
  .improve h3{margin:0 0 4px;font-size:15px}
  .improve p{margin:0 0 10px;font-size:13.5px;color:var(--ink-soft)}
  .btn{font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:10px;border:none;background:var(--blue);color:#fff;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.55;cursor:default}
  .prop{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-top:1px solid #dbe6f7;font-size:13.5px}
  .prop input{margin-top:3px;width:16px;height:16px}
  .prop .f{font-weight:700} .prop .was{color:var(--muted);text-decoration:line-through}
  .prop .now{color:var(--ink);font-weight:600}
  .prop .why{color:var(--ink-soft);margin-top:3px} .prop .ev{color:var(--muted);font-size:12.5px;margin-top:2px}
  .actions{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .packlink{font-size:13px;font-weight:600}
  .runbox{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px;border:1px solid #bfe6d4;border-radius:14px;background:#f3fbf7;padding:14px 16px}
  .runbox h3{margin:0 0 4px;font-size:15px}
  .runbox p{margin:0 0 10px;font-size:13.5px;color:var(--ink-soft)}
  .runbox a.btn{display:inline-block;text-decoration:none}
  .runbox .qr{flex:none;line-height:0;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--line)}
  @media(max-width:640px){.runbox .qr{display:none}}
</style>
<!-- QR code for "run on a phone"; the dashboard works without it (link only). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<header class="top">
  <h1><a href="/" aria-label="Back to the Ustad home page" style="color:inherit;text-decoration:none"><img src="assets/logo-blue.png" alt="" style="height:30px;width:auto;vertical-align:-6px;margin-right:8px" />Ustad</a> <small>supervisor dashboard</small></h1>
  <div class="backend-chip" id="backend-chip">loading…</div>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <section class="panel spend" id="spend"></section>

  <div class="cols">
    <section class="panel">
      <h2>Procedures <span class="count" id="proc-count"></span></h2>
      <div class="rows" id="proc-rows"><div class="empty">Loading…</div></div>
    </section>
    <section class="panel">
      <h2>Sessions <span class="count" id="sess-count"></span></h2>
      <div class="rows" id="sess-rows"><div class="empty">Loading…</div></div>
    </section>
  </div>

  <div id="detail"><p class="hint">Select a procedure or a session above to see its detail here.</p></div>
</div>

<script>
// Signed out: go and sign in, rather than show an empty page.
(function () {
  const raw = window.fetch.bind(window);
  window.fetch = async (...a) => {
    const r = await raw(...a);
    if (r.status === 401 && String(a[0]).startsWith('/api/') && !(a[1] && a[1].headers && a[1].headers['X-Supervisor-Token'])) {
      const body = await r.clone().json().catch(() => ({}));
      if (body.detail === 'sign_in') location.replace('/?signin=' + encodeURIComponent(location.pathname + location.search));
    }
    return r;
  };
})();
</script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g,
  (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = (ts) => ts ? new Date(ts*1000).toLocaleString() : 'n/a';
const dur = (a,b) => (a&&b) ? Math.round(b-a)+'s' : 'n/a';

async function getJSON(u){ const r = await fetch(u); if(!r.ok) throw new Error(u); return r.json(); }

getJSON('/api/health').then((h)=>{
  const where = h.reasoning_backend==='open' ? 'self-hosted open weights' : 'Meta Model API (hosted)';
  $('backend-chip').innerHTML =
    `reasoning: <b>${esc(h.models.reasoning)}</b> · ${esc(where)} · SAM <b>${esc(h.models.sam)}</b>`
    + (h.key_configured ? '' : ' · <span style="color:var(--bad)">no API key</span>');
}).catch(()=>{ $('backend-chip').textContent='backend unreachable'; });

function kpi(v, l, sub, cls){
  return `<div class="kpi"><div class="v ${cls||''}">${v}</div><div class="l">${l}</div>`
       + (sub?`<div class="sub">${sub}</div>`:'')+`</div>`;
}
/* ---- spend against the API budget (metered at list price, per call) ---- */
function loadSpend(){
  getJSON('/api/usage').then((u)=>{
    const pct = Math.min(100, (u.total_usd / u.budget_usd) * 100);
    const tone = pct >= 90 ? 'bad' : pct >= 60 ? 'warn' : 'ok';
    const rows = u.by_model.map((r)=>`<tr><td>${esc(r.model)}</td><td>${esc(r.kind)}</td>
      <td class="num">${r.calls}</td><td class="num">${r.units}</td><td class="num">$${r.cost.toFixed(4)}</td></tr>`).join('');
    $('spend').innerHTML = `<h2>API spend <span class="count">metered at list price</span></h2>
      <div class="spend-body">
        <div class="spend-top"><b>$${u.total_usd.toFixed(2)}</b> of $${u.budget_usd.toFixed(0)} budget
          <span class="muted">· $${u.last_hour_usd.toFixed(2)} in the last hour · $${u.remaining_usd.toFixed(2)} left</span></div>
        <div class="bar"><span class="${tone}" style="width:${pct.toFixed(1)}%"></span></div>
        ${rows ? `<table class="usage"><thead><tr><th>Model</th><th>Billed as</th><th class="num">Calls</th><th class="num">Units</th><th class="num">Cost</th></tr></thead><tbody>${rows}</tbody></table>`
               : '<p class="muted">No metered calls yet.</p>'}
      </div>`;
  }).catch(()=>{ $('spend').innerHTML = ''; });
}
loadSpend(); setInterval(loadSpend, 15000);

getJSON('/api/metrics').then((m)=>{
  const checks = m.checks||0;
  const passRate = m.pass_rate!=null ? Math.round(m.pass_rate*100)+'%' : 'n/a';
  const byB = m.checks_by_backend||{};
  const bLine = Object.keys(byB).length
    ? Object.entries(byB).map(([k,n])=>`${esc(k)}: ${n}`).join(' · ') : 'no checks yet';
  $('kpis').innerHTML =
      kpi(checks, 'Steps verified', `${m.n||0} sessions`, 'accent')
    + kpi(passRate, 'Pass rate', `${m.passes||0} passed`, 'ok')
    + kpi(m.fails||0, 'Errors caught', 'planted or real', (m.fails?'bad':''))
    + kpi((m.avg_latency_ms!=null?m.avg_latency_ms+'ms':'n/a'), 'Mean latency', 'per check')
    + kpi((m.avg_duration_s!=null?m.avg_duration_s+'s':'n/a'), 'Mean session', 'start to finish')
    + kpi(`<span style="font-size:15px;line-height:1.4">${esc(bLine)}</span>`, 'Checks by backend',
          'which model judged');
}).catch(()=>{ $('kpis').innerHTML = '<div class="empty">Metrics unavailable.</div>'; });

let selProc=null;
getJSON('/api/procedures').then((ps)=>{
  $('proc-count').textContent = ps.length ? ps.length+' total' : '';
  const box = $('proc-rows');
  if(!ps.length){ box.innerHTML='<div class="empty">No procedures yet. Capture one on the phone.</div>'; return; }
  box.innerHTML='';
  ps.forEach((p)=>{
    const b=document.createElement('button'); b.className='row';
    b.innerHTML=`<div class="t">${esc(p.title)}</div>`
      +`<div class="m"><span>${p.step_count} steps</span>`
      +`${p.machine?`<span>· ${esc(p.machine)}</span>`:''}`
      +`<span>· ${fmtTime(p.created_at)}</span></div>`;
    b.onclick=()=>{ selectRow('proc',b); showProcedure(p.id); };
    box.appendChild(b);
  });
}).catch(()=>{ $('proc-rows').innerHTML='<div class="empty">Could not load procedures.</div>'; });

const KIND = { visual:'Camera check', reading:'Gauge reading', timed:'Timed', confirm:'Operator confirms' };
function specOf(r){
  if(!r) return '';
  const u = r.unit ? ' '+r.unit : '';
  if(r.min!=null && r.max!=null) return `${r.what}: ${r.min} to ${r.max}${u}`;
  return r.min!=null ? `${r.what}: at least ${r.min}${u}` : `${r.what}: at most ${r.max}${u}`;
}

function refPhoto(s){
  if(!s.ref_image) return `<div class="noimg">no expert photo<br>(older capture)</div>`;
  const b = s.ref_box;
  const box = b && b.img_w ? `<span class="box" style="left:${b.x1/b.img_w*100}%;top:${b.y1/b.img_h*100}%;width:${(b.x2-b.x1)/b.img_w*100}%;height:${(b.y2-b.y1)/b.img_h*100}%"></span>` : '';
  return `<div class="ref"><img loading="lazy" src="/${esc(s.ref_image)}" alt="expert's view">${box}<small>expert's view</small></div>`;
}

const FIELD = { instruction:'Instruction', success_criteria:'Done when', target_phrase:'Target phrase',
  common_mistake:'Common mistake', hazard:'Hazard warning', tip:'Add a tip', watch_for:'Watch live' };
const SAM = { found:'SAM found it on the expert photo', not_found:'SAM could not find it on the expert photo',
  no_photo:'no expert photo to check against', error:'SAM check failed' };

/* Self-improving procedures: Spark reads the runs, proposes edits, SAM checks
 * every phrase on the expert's photo, and nothing changes until approved. */
function improveBox(id, data, runs){
  const prop = data && data.proposal;
  const hist = (data && data.history) || [];
  const histLine = hist.length ? `<p class="muted" style="font-size:12.5px">History: ${hist.map(h=>`v${h.version} replaced ${esc(fmtTime(h.created_at))}`).join(' · ')}</p>` : '';
  if(prop && prop.status==='open' && prop.items.length){
    return `<div class="improve" id="improve"><h3>Muse Spark suggests ${prop.items.length} improvement${prop.items.length>1?'s':''}</h3>
      <p>Based on what happened in the guided runs. Tick the ones to apply; nothing changes until you approve.</p>
      ${prop.items.map((it,i)=>`<label class="prop"><input type="checkbox" data-i="${i}" ${it.sam_check==='not_found'?'':'checked'}>
        <div><div class="f">Step ${it.step}: ${esc(FIELD[it.field]||it.field)}${it.role?` (${esc(it.role)})`:''}</div>
        ${it.before?`<div class="was">${esc(it.before)}</div>`:''}<div class="now">${esc(it.value)}</div>
        <div class="why">${esc(it.why)}</div>${it.evidence?`<div class="ev">Evidence: ${esc(it.evidence)}</div>`:''}
        ${it.sam_check?`<div class="ev">${esc(SAM[it.sam_check]||it.sam_check)}</div>`:''}</div></label>`).join('')}
      <div class="actions"><button class="btn" onclick="applyImprove('${id}','${prop.id}')">Approve selected</button>
        <button class="btn ghost" onclick="applyImprove('${id}','${prop.id}',true)">Dismiss all</button>
        <span id="improve-msg" class="muted"></span></div>${histLine}</div>`;
  }
  const note = prop && prop.status==='open' && !prop.items.length ? 'Last look found nothing to change. ' : '';
  return `<div class="improve" id="improve"><h3>Improve this procedure</h3>
    <p>${note}${runs ? `Muse Spark reads the ${runs} guided run${runs>1?'s':''} (errors caught, questions asked, skips, slow steps) and proposes clearer steps. You approve each change.`
                     : 'Run it with a worker first. Suggestions come from what happens in real runs.'}</p>
    <div class="actions"><button class="btn" ${runs?'':'disabled'} onclick="askImprove('${id}', this)">Suggest improvements</button>
    <span id="improve-msg" class="muted"></span></div>${histLine}</div>`;
}

/* Changing a procedure needs the supervisor token (in .env, or the server's
 * data/supervisor_token.txt). Asked for once, kept in this browser. */
function supToken(reset){
  let t = null;
  try { t = reset ? null : localStorage.getItem('ustad-sup'); } catch(_) {}
  if(!t){
    t = (prompt('Supervisor token (SUPERVISOR_TOKEN in .env, or data/supervisor_token.txt on the server):')||'').trim();
    try { if(t) localStorage.setItem('ustad-sup', t); } catch(_) {}
  }
  return t;
}
async function supFetch(url, opts={}){
  const go = (t) => fetch(url, {...opts, headers:{...(opts.headers||{}), 'X-Supervisor-Token': t||''}});
  let r = await go(supToken());
  if(r.status===401) r = await go(supToken(true));
  return r;
}

async function askImprove(id, btn){
  btn.disabled = true; $('improve-msg').textContent = 'Muse Spark is reading the runs…';
  const r = await supFetch(`/api/procedures/${id}/improve`, {method:'POST'});
  if(!r.ok){ const e = await r.json().catch(()=>({})); $('improve-msg').textContent = e.detail || 'Could not get suggestions.'; btn.disabled=false; return; }
  showProcedure(id);
}

async function applyImprove(id, prid, dismiss){
  const accept = dismiss ? [] : [...document.querySelectorAll('#improve input[type=checkbox]:checked')].map(x=>+x.dataset.i);
  const r = await supFetch(`/api/procedures/${id}/proposals/${prid}/apply`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({accept})});
  const out = await r.json().catch(()=>({}));
  if(!r.ok){ $('improve-msg').textContent = out.detail || 'Could not apply.'; return; }
  showProcedure(id);
}

/* Run a procedure as often as needed: on this device, or on a phone by
 * scanning the code / opening the copied link (the app opens it one tap
 * from starting). */
let runLang = 'en';
function runURL(id){ return `${location.origin}/?run=${encodeURIComponent(id)}${runLang === 'hi' ? '&lang=hi' : ''}`; }
function setRunLang(id, lang){
  runLang = lang;
  const box = document.querySelector('.runbox');
  if (box) box.outerHTML = runBox(id);
}
function runBox(id){
  let qr = '';
  try {
    if (window.qrcode) { const q = qrcode(0, 'M'); q.addData(runURL(id)); q.make(); qr = q.createSvgTag({cellSize:3, margin:2}); }
  } catch(_) {}
  return `<div class="runbox">
    <div><h3>Run this procedure</h3>
      <p>Start a guided job with it, as often as you like. On a phone: scan the code, or open the link.</p>
      <div class="actions"><a class="btn" href="${esc(runURL(id))}">Run this procedure</a>
        <button class="btn ghost" onclick="copyRun('${id}', this)">Copy link</button>
        <button class="btn ghost" onclick="setRunLang('${id}', '${runLang === 'hi' ? 'en' : 'hi'}')">${runLang === 'hi' ? 'Hindi link on. Use English' : 'Use Hindi (हिन्दी)'}</button></div></div>
    ${qr ? `<div class="qr" title="Scan with the phone camera">${qr}</div>` : ''}
  </div>`;
}
async function copyRun(id, btn){
  try { await navigator.clipboard.writeText(runURL(id)); btn.textContent = 'Copied'; }
  catch(_) { prompt('Copy this link:', runURL(id)); }
}

async function showProcedure(id){
  const [p, ins, imp] = await Promise.all([getJSON('/api/procedures/'+id), getJSON(`/api/procedures/${id}/insights`).catch(()=>null),
    getJSON(`/api/procedures/${id}/improve`).catch(()=>null)]);
  const stat = {}; (ins && ins.steps || []).forEach((s)=>{ stat[s.step] = s; });
  const hardest = ins && ins.hardest_step ? p.steps[ins.hardest_step-1] : null;
  let html = `<section class="panel"><h2>${esc(p.title)}
      <span class="count">${p.steps.length} steps · v${p.version||1}${p.machine?' · '+esc(p.machine):''}${ins&&ins.runs?` · ${ins.runs} guided run${ins.runs>1?'s':''}`:''}</span></h2>
      <div style="padding:16px 18px">`;
  html += runBox(id);
  html += improveBox(id, imp, ins && ins.runs);
  if(hardest){
    const h = stat[ins.hardest_step];
    html += `<div class="struggle"><b>Where operators struggle: step ${ins.hardest_step}, ${esc(hardest.title)}.</b>
      ${h.caught} error${h.caught>1?'s':''} caught, ${Math.round((h.first_try_rate||0)*100)}% right first time${h.median_s!=null?`, ${h.median_s} s median`:''}.
      ${h.reasons.length?`Most recent: "${esc(h.reasons[0])}"`:''}</div>`;
  }
  html += `<div class="steps">`;
  p.steps.forEach((s)=>{
    const st = stat[s.index+1];
    const kind = s.check || 'visual';
    html += `<div class="step${hardest && s.index+1===ins.hardest_step?' fail':''}">
      <div>
        <div class="h">${s.index+1}. ${esc(s.title)} <span class="pill kind">${KIND[kind]||kind}</span>
          ${kind==='timed'&&s.duration_s?`<span class="pill">${s.duration_s} s</span>`:''}</div>
        <div class="kv"><b>Say:</b> ${esc(s.instruction)}</div>
        <div class="kv"><b>Target phrase:</b> <code>${esc(s.target_phrase||'n/a')}</code></div>
        <div class="kv"><b>Success criteria:</b> ${esc(s.success_criteria||'n/a')}</div>
        ${s.reading?`<div class="kv"><b>Required reading:</b> ${esc(specOf(s.reading))}</div>`:''}
        ${(s.watch_for||[]).length?`<div class="kv"><b>Watched live:</b> ${s.watch_for.map((w)=>`<span class="pill ${w.role==='hazard'?'bad':'ok'}">${w.role==='hazard'?'Keep clear':'Tool'}: ${esc(w.phrase)}${w.trackable===false?' (not trackable on camera)':''}</span>`).join(' ')}</div>`:''}
        ${s.common_mistake?`<div class="kv"><b>Common mistake:</b> ${esc(s.common_mistake)}</div>`:''}
        ${s.hazard?`<div class="kv"><b>Hazard:</b> ${esc(s.hazard)}</div>`:''}
        ${s.expert_said?`<div class="kv"><b>Expert said:</b> <span class="quote">"${esc(s.expert_said)}"</span></div>`:''}
        ${(s.tips||[]).length?`<div class="kv"><b>Tips from runs:</b> ${s.tips.map(esc).join(' · ')}</div>`:''}
        ${st?`<div class="kv stepstat">${Math.round((st.first_try_rate||0)*100)}% right first time · ${st.caught} caught${st.inferred?` · ${st.inferred} inferred`:''}${st.skipped?` · ${st.skipped} skipped`:''}${st.asked?` · ${st.asked} question${st.asked>1?'s':''}`:''}${st.median_s!=null?` · ${st.median_s} s median`:''}</div>`:''}
        ${st&&st.questions&&st.questions.length?`<div class="kv muted">Asked: ${st.questions.map(q=>esc(q.split(' | ')[0].replace(/^Q: /,''))).join(' · ')}</div>`:''}
      </div>
      ${refPhoto(s)}
    </div>`;
  });
  html += `</div></div></section>`;
  $('detail').innerHTML = html;
  $('detail').scrollIntoView({behavior:'smooth',block:'start'});
}

getJSON('/api/sessions').then((ss)=>{
  $('sess-count').textContent = ss.length ? ss.length+' total' : '';
  const box=$('sess-rows');
  if(!ss.length){ box.innerHTML='<div class="empty">No sessions run yet.</div>'; return; }
  box.innerHTML='';
  ss.forEach((s)=>{
    const outcome = s.outcome||'in progress';
    const cls = s.outcome==='completed'?'ok':(s.outcome==='aborted'?'bad':'warn');
    const b=document.createElement('button'); b.className='row';
    b.innerHTML=`<div class="t">${esc(s.procedure_title||'(unknown procedure)')}</div>`
      +`<div class="m">`
      +`<span class="pill ${cls}">${esc(outcome)}</span>`
      +`${s.worker_name?`<span>${esc(s.worker_name)}</span>`:'<span class="muted">unnamed worker</span>'}`
      +`${s.failures?`<span class="pill bad">${s.failures} caught</span>`:''}`
      +`<span>· ${dur(s.started_at,s.finished_at)}</span>`
      +`</div>`;
    b.onclick=()=>{ selectRow('sess',b); showSession(s.id); };
    box.appendChild(b);
  });
}).catch(()=>{ $('sess-rows').innerHTML='<div class="empty">Could not load sessions.</div>'; });

async function showSession(id){
  const data = await getJSON('/api/sessions/'+id);
  const sess = data.session||{}; const events = data.events||[];
  const passes = events.filter(e=>e.verdict==='pass').length;
  const fails = events.filter(e=>e.verdict==='fail').length;
  const checks = events.filter(e=>['pass','fail','retry'].includes(e.verdict) && e.latency_ms);
  const avg = checks.length ? Math.round(checks.reduce((a,e)=>a+e.latency_ms,0)/checks.length) : 0;

  let html = `<section class="panel"><h2>Session: ${esc(sess.procedure_title||sess.procedure_id||'')}
      <span class="count">${passes} passed · ${fails} caught · ${avg}ms avg ·
      ${dur(sess.started_at,sess.finished_at)} · <a class="packlink" href="/evidence?s=${encodeURIComponent(id)}" target="_blank" rel="noopener">evidence pack</a></span></h2>
      <div style="padding:16px 18px"><div class="steps">`;
  if(!events.length) html += '<div class="empty">No step events recorded.</div>';
  events.forEach((e)=>{
    const conf = e.confidence!=null ? ` · ${Number(e.confidence).toFixed(2)}` : '';
    const img = e.evidence_path
      ? `<img loading="lazy" src="/${esc(e.evidence_path)}" alt="evidence">`
      : `<div class="noimg">no photo<br>(retry / skip)</div>`;
    html += `<div class="step ${esc(e.verdict)}">
      <div>
        <div class="h">Step ${e.step_index+1}
          <span class="pill ${({pass:'ok',confirmed:'ok',fail:'bad',inferred:'kind',notice:'bad',help:'bad',asked:'kind'})[e.verdict]||'warn'}">${esc(({asked:'question',help:'supervisor needed'})[e.verdict]||e.verdict)}${conf}</span>
          ${e.backend?`<span class="pill backend">${esc(e.backend)}</span>`:''}
          ${e.latency_ms?`<span class="muted" style="font-size:12px">${e.latency_ms}ms</span>`:''}
        </div>
        <div class="kv"><b>Reason:</b> ${esc(e.reason||'n/a')}</div>
        ${e.grounding?`<div class="kv" style="white-space:pre-wrap">${esc(e.grounding)}</div>`:''}
        ${e.attempt>1?`<div class="kv muted">attempt ${e.attempt}</div>`:''}
      </div>
      ${img}
    </div>`;
  });
  html += `</div></div></section>`;
  $('detail').innerHTML = html;
  $('detail').scrollIntoView({behavior:'smooth',block:'start'});
}

function selectRow(group, el){
  document.querySelectorAll('.row.sel').forEach(r=>r.classList.remove('sel'));
  el.classList.add('sel');
}
</script>
